modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/bh679/playermob-mc/issues"

[[mods]]
modId="playermob"
version="${version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayURL="https://github.com/bh679/playermob-mc"

[[mixins]]
config="playermob.mixins.json"

[[dependencies.playermob]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.playermob]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.playermob]]
    modId="adventureitemnames"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

# Optional — PlayerMobs pick up Better Combat's animated melee when these are present.
# See README "Mod compatibility". (1.21.1 uses the NeoForge-only "Better Mob Combat Neo" fork.)
[[dependencies.playermob]]
    modId="bettercombat"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.playermob]]
    modId="bettermobcombat"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"
