plugins {
    id "com.gradleup.shadow" version "8.3.5"
}

architectury {
    platformSetupLoomIde()
    neoForge {
        platformPackage = "forge"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    mavenCentral()
    // Modrinth maven — source of the optional Dungeon Train compile-only artifact.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // --- Optional Dungeon Train integration (mod id `dungeontrain`, NeoForge-only) ---
    // Compile-only against DT's public API: NOT bundled and NOT a runtime
    // requirement of our jar. The integration is gated at runtime by
    // ModList.isLoaded("dungeontrain") (see PlayerMobNeoForge#installDungeonTrain),
    // so the published jar loads identically with or without DT. transitive=false
    // keeps DT's own deps off our compile classpath — we only need its classes.
    modCompileOnly("maven.modrinth:dungeon-train:${rootProject.dungeon_train_version}") { transitive = false }
    // DT's ManagedShip API names JOML types (including joml-primitives' AABBdc) in
    // its method signatures, so these must resolve at compile time even though we
    // call none of those methods. Plain libraries — no Loom remap, not shipped.
    compileOnly "org.joml:joml:1.10.5"
    compileOnly "org.joml:joml-primitives:1.10.0"
    // To exercise the live integration in a dev client, drop the Dungeon Train and
    // Sable jars into neoforge/run/mods/ (git-ignored) before `neoforge:runClient`.

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
               "neoforge_version": rootProject.neoforge_version,
               "mod_license": rootProject.mod_license,
               "mod_name": rootProject.mod_name,
               "mod_description": rootProject.mod_description,
               "mod_authors": rootProject.mod_authors
    }
    inputs.property "version", project.version
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }
    repositories {
        maven { url "file://${rootProject.projectDir}/repo" }
    }
}
