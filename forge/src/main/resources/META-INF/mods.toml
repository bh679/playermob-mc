modLoader="javafml"
loaderVersion="${forge_loader_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/bh679/playermob-mc/issues"

[[mods]]
modId="playermob"
version="${version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayURL="https://github.com/bh679/playermob-mc"

[[mixins]]
config="playermob.mixins.json"

[[dependencies.playermob]]
    modId="forge"
    mandatory=true
    versionRange="${forge_loader_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.playermob]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.playermob]]
    modId="adventureitemnames"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"

# Optional — PlayerMobs pick up Better Combat's animated melee when these are present.
# See README "Mod compatibility". (Better Combat 1.8.6 ↔ Better Mob Combat 1.3.0 on 1.20.1.)
[[dependencies.playermob]]
    modId="bettercombat"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.playermob]]
    modId="bettermobcombat"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"
