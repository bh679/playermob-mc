# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.caching=true

# Mod
mod_id=playermob
mod_name=PlayerMob
mod_license=PolyForm Shield 1.0.0
mod_version=0.51.0
mod_group_id=games.brennan.playermob
mod_authors=Brennan Hatton
mod_description=Custom mob that looks like a player and acts like a pillager — weapon-aware ranged/melee AI, designed for extensible per-mob stance profiles. Spawn egg + /summon for v1.

# --- Multi-version build (Stonecutter) ---
# The Minecraft version is NOT set here — Stonecutter drives it (see settings.gradle.kts
# `versions(...)` + stonecutter.gradle.kts `active`). Per-MC dependency coordinates
# (Fabric API / Forge / NeoForge) live in each loader's build.gradle.kts `when (mc)` map.
# Enabled loader platforms come from architectury.common(...) in the root build.

# Fabric loader — MC-agnostic, shared across versions. 0.16.10+ is required by
# Fabric API 0.92.9+1.20.1 (and is back-compatible with the 1.21.1 build).
fabric_loader_version=0.16.10

# Optional Dungeon Train integration (NeoForge-only, 1.21.1). Modrinth version_number.
dungeon_train_version=v0.270.0

# Bundled Adventure Item Names (Jar-in-Jar, MC 1.21.1 only — Fabric/Forge/NeoForge).
# This is the Modrinth version_number stem; each loader build appends its own
# "+<loader>-1.21.1" suffix to resolve the loader-specific published jar. AIN auto-loads
# alongside PlayerMob; disable via AIN's own config or by removing the nested jar.
# Keep the leading "v" — it's part of the Modrinth version_number (e.g. v0.46.0+fabric-1.21.1).
ain_version=v0.46.0
