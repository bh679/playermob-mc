# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft
minecraft_version=1.21.1

# Mod
mod_id=playermob
mod_name=PlayerMob
mod_license=PolyForm Shield 1.0.0
mod_version=0.43.1
mod_group_id=games.brennan.playermob
mod_authors=Brennan Hatton
mod_description=Custom mob that looks like a player and acts like a pillager — weapon-aware ranged/melee AI, designed for extensible per-mob stance profiles. Spawn egg + /summon for v1.

# Architectury — enabled loader platforms (drives common("...") config).
# NOTE: Architectury *Loom* (gradle plugin) supports all three loaders, but the
# Architectury *API* runtime (13.x for 1.21) only ships fabric + neoforge artifacts.
# To keep Forge in our build, we DO NOT depend on the Architectury API runtime —
# entity / item / attribute / renderer registration lives in each loader's
# entry class using that loader's native APIs (mirrors AdventureItemNames).
enabled_platforms=fabric,forge,neoforge

# Fabric
fabric_loader_version=0.16.5
fabric_api_version=0.103.0+1.21.1

# Forge — 1.21.1-52.x line
forge_version=1.21.1-52.1.14

# NeoForge
neoforge_version=21.1.228

# Optional Dungeon Train integration (NeoForge-only) — see neoforge/build.gradle.
# Compiled against (compile-only) and gated at runtime via
# ModList.isLoaded("dungeontrain"). Value is the Modrinth version_number (DT
# publishes with a leading `v`).
dungeon_train_version=v0.270.0
