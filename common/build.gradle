architectury {
    common rootProject.enabled_platforms.split(",")
}

dependencies {
    // Fabric loader provides the mixin/annotation deps and @Environment annotations
    // used by common code. We do NOT use other Fabric loader classes here — those
    // would be remapped incorrectly on Forge/NeoForge.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly  "org.junit.platform:junit-platform-launcher"
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// Bake mod_version + the current git branch into a resource so the client-side
// version HUD (VersionInfo / VersionHudRenderer) can display them. This lives
// in `common` so the single generated file ships in ALL three loader jars —
// common resources are shadowed into each platform jar (same path the lang +
// spawn-egg model already travel). Mirrors DungeonTrainCraft's approach.
//
// The branch is the dev-vs-release signal: VersionHudRenderer hides the HUD only
// when branch == "main" (the branch every public release builds from). Worktrees
// and feature branches bake their own name and show the HUD. Detached HEAD falls
// back to the short commit SHA (still != "main" → shown).
// ---------------------------------------------------------------------------
def gitBranch = { ->
    try {
        def proc = ['git', 'rev-parse', '--abbrev-ref', 'HEAD']
                .execute(null, rootProject.projectDir)
        proc.waitForOrKill(5000)
        def name = proc.in.text.trim()
        if (name == 'HEAD' || name.isEmpty()) {
            def p2 = ['git', 'rev-parse', '--short', 'HEAD']
                    .execute(null, rootProject.projectDir)
            p2.waitForOrKill(5000)
            def sha = p2.in.text.trim()
            return sha ?: 'unknown'
        }
        return name
    } catch (Exception e) {
        logger.warn("Could not resolve git branch for version resource: {}", e.message)
        return 'unknown'
    }
}()

tasks.register('generateVersionProperties', ProcessResources) {
    var replaceProperties = [
        mod_version: rootProject.mod_version,
        git_branch : gitBranch,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir tasks.named('generateVersionProperties')

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = "${rootProject.mod_id}-common"
            from components.java
        }
    }
    repositories {
        maven { url "file://${rootProject.projectDir}/repo" }
    }
}
